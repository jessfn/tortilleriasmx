server {
    listen 80;
    server_name tortilleriasmx.geodatos.com.mx;
    root /var/www/tortilleriasmx-web;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Estos archivos SIEMPRE se revalidan: así cada despliegue se detecta de inmediato
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { }
        default_type application/manifest+json;
    }

    # Archivos con nombre único por contenido: se pueden guardar mucho tiempo
    location ~* \.(js|css|png|jpg|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
