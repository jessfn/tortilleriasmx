# SOLO para el servidor ANTERIOR (Hostinger), después del cambio de DNS.
# Los teléfonos con la app instalada desde el dominio anterior pueden tener capturas guardadas sin enviar (bandeja sin conexión):
# viven en el navegador de ese dominio y solo se pueden enviar desde ahí. Por eso el dominio anterior de la API se queda
# funcionando y reenvía todo a la API nueva, y el CORS de la API nueva acepta también el origen anterior (CORS_ORIGIN con coma).
# Se retira cuando ya nadie use el dominio anterior (2 a 4 semanas). Sustituye el bloque `location /` de nginx-api.conf.

server {
    listen 80;
    server_name apitortillerias.geodatos.com.mx;
    client_max_body_size 20m;

    location / {
        proxy_pass https://apitortillerias.agricultura.gob.mx;
        proxy_ssl_server_name on;
        proxy_set_header Host apitortillerias.agricultura.gob.mx;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
