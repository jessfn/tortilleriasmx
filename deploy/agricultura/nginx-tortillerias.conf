# Tortillerías en el servidor de la Secretaría (simprdwbsza01).
# Copiar a /etc/nginx/sites-available/tortillerias y enlazar en sites-enabled. Probar con `sudo nginx -t` ANTES de recargar.
# Cada servidor atiende el puerto 80 (HTTP desde el balanceador, con X-Forwarded-Proto) y el 443 (HTTPS con el certificado
# comodín *.agricultura.gob.mx, igual que SIMAC). Sin el bloque de 443, un nombre nuevo cae en el servidor por defecto de
# SIMAC y se vería la aplicación equivocada. Zonas conn_zone, auth_zone y general_zone ya existen en nginx.conf.

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/ssl/agricultura/fullchain_completo.pem;
    ssl_certificate_key /etc/ssl/agricultura/key.pem;
    server_name tortilleriasmx.agricultura.gob.mx;

    client_max_body_size 20m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 30s;
    limit_conn conn_zone 20;

    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    # La PWA compilada (apps/web/dist). No hay carpeta /uploads: las fotos son privadas y solo las entrega la API con sesión.
    root /var/www/Tortillerias/apps/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # La app se actualiza sola: estos archivos nunca deben quedar en caché
    location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /sw.js      { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        limit_req zone=general_zone burst=60 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Íconos, fotos de portada y modelos 3D (sin hash en el nombre: caché moderada)
    location ~* \.(png|jpg|ico|svg|glb|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Aplicación de una sola página: /acceso (administración) y el resto caen en index.html
    location / {
        limit_req zone=general_zone burst=40 nodelay;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/ssl/agricultura/fullchain_completo.pem;
    ssl_certificate_key /etc/ssl/agricultura/key.pem;
    server_name apitortillerias.agricultura.gob.mx;

    client_max_body_size 20m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 30s;
    limit_conn conn_zone 20;

    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # El catálogo de un estado viaja comprimido (el de México pasa de ~3 MB a ~0.5 MB)
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Inicio de sesión y registro: límite más estricto (fuerza bruta). La API no usa prefijo /api.
    location ~ ^/auth/(login|registro) {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=general_zone burst=40 nodelay;
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
