name: Deploy a VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy en VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          script: |
            chmod +x /var/www/tortilleriasmx/deploy/deploy.sh
            cd /var/www/tortilleriasmx && ./deploy/deploy.sh
